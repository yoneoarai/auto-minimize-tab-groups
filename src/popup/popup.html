<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabbi — Tab Group Manager</title>
    <style>
      :root {
        --primary: #1a73e8;
        --primary-hover: #1557b0;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --bg: #ffffff;
        --bg-subtle: #f8f9fa;
        --border: #dadce0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 280px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        color: var(--text-primary);
        background-color: var(--bg);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .title-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-icon {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        display: block;
      }

      .header h1 {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      /* Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 20px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #ccc;
        transition: .2s;
        border-radius: 20px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .2s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: var(--primary);
      }

      input:checked + .slider:before {
        transform: translateX(18px);
      }

      /* Stats list */
      .stats-card {
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 14px;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0;
      }

      .stat-label {
        color: var(--text-secondary);
      }

      .stat-value {
        font-weight: 600;
      }

      .control-card {
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 14px;
      }

      .control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .control-text {
        display: flex;
        flex-direction: column;
      }

      .control-title {
        font-weight: 600;
        font-size: 13px;
        color: var(--text-primary);
      }

      .control-subtitle {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      .control-card.disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .paused-badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: #fef08a;
        color: #854d0e;
        padding: 1px 6px;
        border-radius: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 9px 12px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn:hover {
        background-color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title-container">
        <img src="icon-large.svg" alt="Tabbi" class="header-icon">
        <h1>Tabbi</h1>
      </div>
      <label class="switch" title="Toggle Tabbi on/off">
        <input type="checkbox" id="popup-enable-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="control-card" id="pause-collapse-card">
      <div class="control-row">
        <div class="control-text">
          <span class="control-title">Pause auto-collapse</span>
          <span class="control-subtitle">Keep groups open while working</span>
        </div>
        <label class="switch" title="Pause auto-collapsing for all groups">
          <input type="checkbox" id="popup-pause-collapse-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="stats-card">
      <div class="stat-row">
        <span class="stat-label">Active rules</span>
        <span class="stat-value" id="stat-rules-count">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Active groups</span>
        <span class="stat-value" id="stat-groups-count">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Default timeout</span>
        <span class="stat-value" id="stat-timeout">30s</span>
      </div>
    </div>

    <button id="open-settings-btn" class="btn">⚙ Open Full Settings</button>

    <script src="popup.js"></script>
  </body>
</html>
